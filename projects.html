</head>

<body>
    <div class="page-shell">
        <header class="site-header">
            <nav class="navbar container">
                <a href="index.html" class="brand" aria-label="Beshoy Code">
                    <span class="brand-mark">BC</span>
                    <span>
                        <strong>Beshoy Code</strong>
                        <small>By Code | Beshoy Eshak</small>
                    </span>
                </a>
                <button class="nav-toggle" aria-label="فتح القائمة" aria-expanded="false">
                    <span></span><span></span><span></span>
                </button>
                <div class="nav-panel">
                    <ul class="nav-links">
                        <li><a href="index.html">الرئيسية</a></li>
                        <li><a href="learning.html">التعلم</a></li>
                        <li><a href="courses.html">الكورسات</a></li>

                        <li><a href="practice.html">التدريب</a></li>
                        <li><a href="search.html">بحث</a></li>
                        <li><a href="about.html">من نحن</a></li>
                        <li><a href="services.html">الخدمات</a></li>
                        <li><a href="contact.html">تواصل معنا</a></li>
                    </ul>
                    <div class="nav-tools">
                        <button id="theme-toggle" class="icon-btn" aria-label="تبديل الثيم">☀️</button>
                    </div>
                </div>
            </nav>
        </header>

        <main class="page-main">
            <section class="section">
                <div class="container">
                    <div class="section-heading reveal">
                        <span class="eyebrow">المشاريع</span>
                        <h1>مشاريع رقمية يمكنك تجربتها</h1>
                        <p>استكشف واجهات تفاعلية، افتح معاينتها، واطّلع على الكود المستخدم في بنائها.</p>
                    </div>
                    <div id="project-list" class="cards-grid"></div>
                </div>
            </section>
        </main>

        <dialog class="project-dialog" id="project-dialog" aria-labelledby="project-dialog-title">
            <div class="project-dialog-head">
                <div><span class="eyebrow">معاينة تفاعلية</span>
                    <h2 id="project-dialog-title"></h2>
                </div>
                <button class="icon-btn" type="button" data-close-project aria-label="إغلاق">×</button>
            </div>
            <div class="project-dialog-tabs" role="tablist" aria-label="محتوى المشروع">
                <button type="button" class="active" data-project-tab="preview">المعاينة</button>
                <button type="button" data-project-tab="code">الكود</button>
                <button type="button" class="project-copy" data-copy-project>نسخ الكود</button>
            </div>
            <div class="project-dialog-view" data-project-view="preview"><iframe id="project-demo-frame"
                    title="معاينة المشروع" sandbox="allow-scripts"></iframe></div>
            <div class="project-dialog-view" data-project-view="code" hidden>
                <pre><code id="project-source"></code></pre>
            </div>
        </dialog>

        <footer class="site-footer">
            <div class="container footer-content">
                <div>
                    <h4>Beshoy Code</h4>
                </div>
            </div>
        </footer>
